<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Sets data-theme before first paint so a dark page never flashes light.
         Keep in sync with src/ui/theme/use-theme.ts (storage key, values). -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (error) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cstyle%3Erect%7Bstroke:%23000;fill:none;stroke-width:2%7D.f%7Bfill:%23000%7D@media (prefers-color-scheme:dark)%7Brect%7Bstroke:%23fff%7D.f%7Bfill:%23fff%7D%7D%3C/style%3E%3Crect x='2.5' y='6.5' width='9' height='11'/%3E%3Crect class='f' x='12.5' y='6.5' width='9' height='11'/%3E%3C/svg%3E"
    />
    <title>Issue Arena</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
